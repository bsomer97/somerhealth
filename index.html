<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ourHealth</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ourHealth">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-row">
    <h1 id="app-title">ourHealth</h1>
    <span class="offline-pill">offline · will sync</span>
  </div>
  <div id="person-switch" class="person-switch"></div>
</header>

<main id="view-root"></main>

<div id="lightbox-root"></div>

<nav class="tabbar">
  <button data-action="switch-view" data-view="schedule" class="tab active"><span class="tab-icon">📅</span><span class="tab-label">Schedule</span></button>
  <button data-action="switch-view" data-view="today" class="tab"><span class="tab-icon">⚡</span><span class="tab-label">Today</span></button>
  <button data-action="switch-view" data-view="food" class="tab"><span class="tab-icon">🍽</span><span class="tab-label">Food</span></button>
  <button data-action="switch-view" data-view="library" class="tab"><span class="tab-icon">🏋️</span><span class="tab-label">Library</span></button>
  <button data-action="switch-view" data-view="progress" class="tab"><span class="tab-icon">📈</span><span class="tab-label">Progress</span></button>
  <button data-action="switch-view" data-view="settings" class="tab"><span class="tab-icon">⚙️</span><span class="tab-label">Settings</span></button>
</nav>

<!-- Order matters: config → data layer → app shell → screens → muscle map → Firebase -->
<script src="js/config.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/app.js"></script>
<script defer src="js/views/workouts.js"></script>
<script defer src="js/views/food.js"></script>
<script defer src="js/views/progress.js"></script>
<script defer src="js/views/settings.js"></script>
<script type="module" src="js/muscle-map.js"></script>
<script type="module" src="js/cloud.js"></script>
</body>
</html>
